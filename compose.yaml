services:
  redis:
    image: redis:7-alpine
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes
    volumes: 
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL","REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
  rate_limit:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: ${REDIS_DB}
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy  
volumes:
  redis_data: